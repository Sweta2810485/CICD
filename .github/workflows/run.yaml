
name: Model Training CICD

permissions:
  contents: read
  issues: write
  pull-requests: write

on:
  push:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CML
        uses: iterative/setup-cml@v2

      - name: Train model
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install -r requirements.txt

          python train_model.py

      - name: Generate CML Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "# Machine Learning Model Report" > report.md

          echo "## Model Scores" >> report.md
          cat scores.txt >> report.md

          echo "" >> report.md
          echo "## Generated Files" >> report.md
          echo "- ConfusionMatrix.png" >> report.md
          echo "- ConfusionMatrix_RF.png" >> report.md
          echo "- FeatureImportance.png" >> report.md

          cml comment create --publish=false report.md
